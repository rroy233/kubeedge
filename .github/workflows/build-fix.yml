# 构建 KubeEdge v1.22.2-fix（linux/amd64）：仅用于本论文实验环境。
#
# 为什么需要这个 workflow：
#   官方 v1.22.2 的 MetaServer `unhold-upgrade` handler 通过 metaclient 发 HTTPS 请求
#   回调 MetaServer 自己，而服务端证书由集群 CA 签发、内部客户端证书由 KubeEdge CA 签发，
#   单一 tlsCaFile 无法同时满足两侧 → handler 内部必然失败（x509 unknown authority），
#   分区期间的本地 release 永不生效。本分支把该 handler 改成直接读本地 meta_v2
#   （imitator.DefaultV2Client），不引入 TCP/TLS/证书，也不改动 hold/release 协议。
#
# 为什么必须在 Linux 上带 cgo 构建：
#   edgecore 的 meta_v2 用 go-sqlite3，需要 cgo。CGO_ENABLED=0 编出来的二进制启动即
#   "go-sqlite3 requires cgo to work. This is a stub" 并退出（实测踩过）。
name: Build kubeedge v1.22.2-fix (linux/amd64)

on:
  push:
    branches: [main]
    tags: ['v1.22.2-fix*']
  workflow_dispatch:

permissions:
  contents: write   # 用于把产物挂到 Release（若仓库只允许只读 token，本步骤会失败但 artifact 仍在）

env:
  KUBEEDGE_VERSION_TAG: v1.22.2
  ARTIFACT_VERSION: v1.22.2-fix

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出（含 tag，KubeEdge 版本探测依赖 git describe）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'

      - name: 校验补丁在位（unhold handler 已改为读本地 meta_v2）
        run: |
          set -euo pipefail
          f=edge/pkg/metamanager/metaserver/handlerfactory/extend_unhold_upgrade.go
          grep -q 'imitator.DefaultV2Client' "$f"
          grep -q 'getLocalPod' "$f"
          if grep -q 'metaclient.KubeClient' "$f"; then
            echo "补丁缺失：handler 仍在用 metaclient.KubeClient（HTTPS 自回环）" >&2
            exit 1
          fi
          echo "补丁校验通过：$(git log --oneline -1)"

      - name: 构建（native amd64 + cgo）
        env:
          BUILD_WITH_CONTAINER: "false"
          GOWORK: "off"
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          go version
          gcc --version | head -1
          hack/make-rules/build.sh admission cloudcore csidriver iptablesmanager controllermanager edgecore keadm
          file _output/local/bin/edgecore

      - name: 打包成官方 layout（keadm 可直接使用）
        run: |
          set -euo pipefail
          D="kubeedge-${KUBEEDGE_VERSION_TAG}-linux-amd64"
          rm -rf release && mkdir -p "release/${D}/cloud" "release/${D}/edge"
          B=_output/local/bin
          cp "$B"/admission "$B"/csidriver "$B"/iptablesmanager "$B"/controllermanager "$B"/cloudcore "release/${D}/cloud/"
          cp "$B"/edgecore "release/${D}/edge/edgecore"
          echo "${KUBEEDGE_VERSION_TAG}" > "release/${D}/version"
          (cd release && tar czf "../kubeedge-${KUBEEDGE_VERSION_TAG}-linux-amd64.tar.gz" "${D}")
          # keadm 要求的校验文件格式是"单行 SHA512"，缺了它会走交互式 [y/N] 提问
          sha512sum "kubeedge-${KUBEEDGE_VERSION_TAG}-linux-amd64.tar.gz" | cut -d' ' -f1 \
            > "checksum_kubeedge-${KUBEEDGE_VERSION_TAG}-linux-amd64.tar.gz.txt"
          sha256sum "kubeedge-${KUBEEDGE_VERSION_TAG}-linux-amd64.tar.gz" | cut -d' ' -f1 \
            > "kubeedge-${KUBEEDGE_VERSION_TAG}-linux-amd64.tar.gz.sha256"
          sha256sum "release/${D}/edge/edgecore" | cut -d' ' -f1 > edgecore.sha256

      - name: 摘要（部署脚本要固定的两个指纹）
        run: |
          {
            echo "### KubeEdge ${ARTIFACT_VERSION} 构建产物"
            echo ""
            echo "| 项 | sha256 |"
            echo "| --- | --- |"
            echo "| tarball | \`$(cat kubeedge-v1.22.2-linux-amd64.tar.gz.sha256)\` |"
            echo "| edgecore | \`$(cat edgecore.sha256)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      # ---- Docker Hub：构建 keadm 的 installation-package 镜像并推送 ----
      #
      # 为什么需要：keadm join 在容器模式下执行的是「Pull Images → Copy resources from the
      # image」，它拉的就是 <image-repository>/installation-package:<kubeedge-version>，
      # 再从容器里的 /usr/local/bin/edgecore 拷到宿主机；--tarballpath 在这条路径上不生效。
      # 把我们的构建推成同名镜像后，keadm join --image-repository=<dockerhub用户> 就会直接
      # 装上 fix 版 edgecore（标签必须与 --kubeedge-version 的版本串一致，即 v1.22.2）。
      - name: 登录 Docker Hub
        id: dockerhub
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "未配置仓库 secret DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，跳过镜像推送" >&2
            exit 1
          fi
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: 构建并推送 installation-package 镜像
        if: steps.dockerhub.outcome == 'success'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          mkdir -p image
          cp _output/local/bin/edgecore image/edgecore
          cp _output/local/bin/keadm image/keadm
          cat > image/Dockerfile <<'DOCKERFILE'
          FROM ubuntu:22.04
          COPY edgecore /usr/local/bin/edgecore
          COPY keadm /usr/local/bin/keadm
          WORKDIR /etc/kubeedge
          DOCKERFILE
          IMAGE="${DOCKERHUB_USERNAME}/installation-package"
          # 标签必须带 v 前缀：keadm 用 --kubeedge-version=v1.22.2 拼镜像引用
          docker build -t "${IMAGE}:v1.22.2" image/
          docker tag "${IMAGE}:v1.22.2" "${IMAGE}:${ARTIFACT_VERSION}"
          docker push "${IMAGE}:v1.22.2"
          docker push "${IMAGE}:${ARTIFACT_VERSION}"
          {
            echo ""
            echo "### Docker Hub 镜像"
            echo "- \`${IMAGE}:v1.22.2\`（keadm join --image-repository=${DOCKERHUB_USERNAME} 用的标签）"
            echo "- \`${IMAGE}:${ARTIFACT_VERSION}\`（同一镜像的 fix 标记标签）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubeedge-${{ env.ARTIFACT_VERSION }}-linux-amd64
          retention-days: 30
          path: |
            kubeedge-v1.22.2-linux-amd64.tar.gz
            checksum_kubeedge-v1.22.2-linux-amd64.tar.gz.txt
            kubeedge-v1.22.2-linux-amd64.tar.gz.sha256
            edgecore.sha256

      - name: 发布到 Release（${{ env.ARTIFACT_VERSION }}）
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ARTIFACT_VERSION }}
          name: KubeEdge ${{ env.ARTIFACT_VERSION }} (linux/amd64, 本地实验用)
          body: |
            基于 KubeEdge v1.22.2 的本地补丁构建：MetaServer `unhold-upgrade` 改为直接读本地
            `meta_v2` 缓存，不再 HTTPS 回调自身（官方实现在分区场景下因证书角色冲突必然失败）。
            仅用于本论文实验环境，非上游发布。
          files: |
            kubeedge-v1.22.2-linux-amd64.tar.gz
            checksum_kubeedge-v1.22.2-linux-amd64.tar.gz.txt
            kubeedge-v1.22.2-linux-amd64.tar.gz.sha256
            edgecore.sha256
          fail_on_unmatched_files: true
